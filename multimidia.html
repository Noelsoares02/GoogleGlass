
<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Google Glass - Multimídia</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div id="interface">

        <!-- =========================
             CABEÇALHO
        ========================== -->

        <header id="cabecalho">

            <hgroup>

                <h1>Google Glass</h1>

                <h2>A revolução do Google está chegando</h2>

            </hgroup>

            <!-- IMAGEM DO GOOGLE GLASS -->

            <img id="icone" src="./_imagens/multimidia.png" alt="Multimidea">


            <!-- =========================
                 MENU PRINCIPAL
            ========================== -->

            <nav id="menu">

                <h1>Menu Principal</h1>

                <ul>

                    <li>
                        <a href="index.html">Home</a>
                    </li>

                    <li>
                        <a href="specs.html">Especificações</a>
                    </li>

                    <li>
                        <a href="fotos.html">Fotos</a>
                    </li>

                    <li>
                        <a href="multimidia.html">Multimídia</a>
                    </li>

                    <li>
                        <a href="fale-conosco.html">Fale conosco</a>
                    </li>

                </ul>

            </nav>

        </header>


        <!-- =========================
             CORPO DA PÁGINA
        ========================== -->

        <section id="corpo">

            <article id="noticia-principal">

                <header id="cabecalho-artigo">

                    <hgroup>

                        <h3>Glass &gt; Multimídia</h3>

                        <h1>Sons e Vídeos</h1>

                        <h2>por Gustavo Guanabara</h2>

                        <h3 class="direita">
                            Atualizado em 01/Maio/2013
                        </h3>

                    </hgroup>

                </header>


                <!-- =========================
                     ÁUDIO E VÍDEO
                ========================== -->

                <h2>Áudio e Vídeo</h2>


                <!-- =========================
                     VÍDEO
                ========================== -->

                <video id="filme"
                       controls
                       poster="./_imagens/radio-tv.png"
                       width="500">

                    <source src="media/video-glass.mp4"
                            type="video/mp4">

                    <source src="media/video-glass.webm"
                            type="video/webm">

                    Seu navegador não suporta vídeos em HTML5.

                </video>


                <!-- =========================
                     ÁUDIO
                ========================== -->

                <audio id="musica"
                       controls>

                    <source src="media/audio-glass.mp3"
                            type="audio/mpeg">

                    <source src="media/audio-glass.ogg"
                            type="audio/ogg">

                    Seu navegador não suporta áudio em HTML5.

                </audio>

            </article>

        </section>


        <!-- =========================
             RODAPÉ
        ========================== -->

        <footer id="rodape">

            <p>
                Copyright &copy; 2013 - by Gustavo Guanabara
            </p>

            <p>

                <a href="#">Facebook</a>
                |
                <a href="#">Twitter</a>

            </p>

        </footer>

    </div>

</body>

</html>
